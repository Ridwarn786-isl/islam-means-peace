<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        /* Header / Navbar */
        header {
            background-color: #111;
            border-bottom: 2px solid #ff0033;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .logo span {
            background-color: #ff0033;
            color: #fff;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 5px;
        }

        .admin-btn {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Container Layout */
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Admin Panel */
        .admin-panel {
            background-color: #1a1a1a;
            border: 1px solid #ff0033;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none; /* Admin Mode မဖွင့်မချင်း ဖုံးထားမည် */
        }

        .admin-panel h3 {
            color: #ff0033;
            margin-bottom: 10px;
        }

        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 3px;
        }

        .admin-panel button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Video Player Section */
        .player-container {
            background-color: #111;
            padding: 10px;
            border-radius: 5px;
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }

        .video-box iframe, .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-details {
            margin-top: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .video-title {
            font-size: 20px;
            color: #ff0033;
            margin-bottom: 10px;
        }

        .video-caption {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }

        /* Comments Section */
        .comments-section {
            margin-top: 20px;
            background-color: #111;
            padding: 15px;
            border-radius: 5px;
        }

        .comments-section h3 {
            margin-bottom: 15px;
            color: #fff;
        }

        .comment-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .comment-input-box input {
            flex: 1;
            padding: 10px;
            background-color: #222;
            border: 1px solid #333;
            color: #fff;
            border-radius: 3px;
        }

        .comment-input-box button {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 3px;
        }

        .comment-list {
            list-style: none;
        }

        .comment-item {
            background-color: #1a1a1a;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #ff0033;
            border-radius: 3px;
        }

        .comment-item span {
            font-size: 12px;
            color: #888;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">MY<span>VIDEOS</span></div>
        <button class="admin-btn" onclick="toggleAdmin()">Admin Toggle</button>
    </header>

    <div class="container">

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3>Admin Dashboard (Add/Update Video)</h3>
            <input type="text" id="adminVideoTitle" placeholder="Video ခေါင်းစဉ် ရေးပါ...">
            <input type="text" id="adminVideoLink" placeholder="Embed/Player Link ထည့်ပါ (e.g. YouTube Embed, Drive Link)">
            <textarea id="adminVideoCaption" rows="4" placeholder="Video အတွက် Caption/အကြောင်းအရာ ရေးပါ..."></textarea>
            <button onclick="saveVideoData()">Video တင်မည် / ပြောင်းမည်</button>
        </div>

        <!-- Main Video Display Area -->
        <div class="player-container">
            <div class="video-box" id="videoBox">
                <iframe id="mainPlayer" src="" allowfullscreen></iframe>
            </div>
            
            <div class="video-details">
                <h1 class="video-title" id="displayTitle">ခေါင်းစဉ် မရှိသေးပါ</h1>
                <p class="video-caption" id="displayCaption">Caption မရှိသေးပါ။</p>
            </div>
        </div>

        <!-- Viewer Comment Section -->
        <div class="comments-section">
            <h3>Comments (Viewer များ မှတ်ချက်ပေးနိုင်သည်)</h3>
            
            <div class="comment-input-box">
                <input type="text" id="commentInput" placeholder="မှတ်ချက် ရေးရန်...">
                <button onclick="addComment()">Comment ပေးမည်</button>
            </div>

            <ul class="comment-list" id="commentList">
                <!-- Comment များ ဤနေရာတွင် ပေါ်မည် -->
            </ul>
        </div>

    </div>

    <script>
        // Admin Panel ကို Toggle လုပ်ပြီး တင်ထားသော Data များကို Input Field များထဲသို့ ဖြည့်သွင်းပေးခြင်း
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                let password = prompt("Admin Password ရိုက်ထည့်ပါ:");
                if (password === "ridwarn952001@") { // Admin စကားဝှက်
                    panel.style.display = 'block';
                    populateAdminInputs(); // Admin Panel ပွင့်သွားပါက ယခင်တင်ထားသော အချက်အလက်များ ဖြည့်ပေးမည်
                } else {
                    alert("Password မှားယွင်းနေပါသည်။");
                }
            } else {
                panel.style.display = 'none';
            }
        }

        // LocalStorage မှ အချက်အလက်များကို Admin Input များထဲသို့ ထည့်သွင်းခြင်း
        function populateAdminInputs() {
            const savedData = localStorage.getItem('site_video_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('adminVideoTitle').value = data.title || "";
                document.getElementById('adminVideoLink').value = data.link || "";
                document.getElementById('adminVideoCaption').value = data.caption || "";
            }
        }

        // Admin မှ Video အချက်အလက်များ သိမ်းဆည်းခြင်း / Edit ပြုလုပ်ခြင်း
        function saveVideoData() {
            const title = document.getElementById('adminVideoTitle').value;
            const link = document.getElementById('adminVideoLink').value;
            const caption = document.getElementById('adminVideoCaption').value;

            if (!link) {
                alert("ကျေးဇူးပြု၍ Video Link ထည့်ပါ!");
                return;
            }

            // Web Storage တွင် အချက်အလက်များကို ပြင်ဆင်သိမ်းဆည်းမည်
            const videoData = { title, link, caption };
            localStorage.setItem('site_video_data', JSON.stringify(videoData));

            loadVideoData();
            alert("Video အချက်အလက်များကို အောင်မြင်စွာ ပြင်ဆင်ပြီးပါပြီ။");
        }

        // တင်ထားသော Video အချက်အလက်များကို ရယူပြသခြင်း
        function loadVideoData() {
            const savedData = localStorage.getItem('site_video_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('displayTitle').innerText = data.title || "ခေါင်းစဉ် မရှိပါ";
                document.getElementById('displayCaption').innerText = data.caption || "Caption မရှိပါ။";
                document.getElementById('mainPlayer').src = data.link;
            }
        }

        // Comment ထည့်သွင်းခြင်း
        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();

            if (text === "") return;

            let comments = JSON.parse(localStorage.getItem('site_comments') || "[]");
            const newComment = {
                text: text,
                time: new Date().toLocaleString()
            };

            comments.push(newComment);
            localStorage.setItem('site_comments', JSON.stringify(comments));

            input.value = "";
            loadComments();
        }

        // Comment များကို ပြသခြင်း
        function loadComments() {
            const commentList = document.getElementById('commentList');
            commentList.innerHTML = "";
            let comments = JSON.parse(localStorage.getItem('site_comments') || "[]");

            comments.forEach(c => {
                const li = document.createElement('li');
                li.className = 'comment-item';
                li.innerHTML = `${escapeHtml(c.text)} <span>${c.time}</span>`;
                commentList.appendChild(li);
            });
        }

        // XSS Protection အတွက် HTML Escape လုပ်ခြင်း
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // စာမျက်နှာ စဖွင့်ချိန်တွင် ဒေတာများ ဆွဲယူခြင်း
        window.onload = function() {
            loadVideoData();
            loadComments();
        };
    </script>
</body>
</html>
